name: Publish a release

# Manual: runs the tests, builds the desktop application (IES_3.Avalonia) as a self-contained Windows
# .exe and a Linux .deb, and publishes both as a GitHub Release tagged v<version>. The release is
# marked as the latest one, which is what the project's homepage offers: the README's download buttons
# link to releases/latest/download/<file>, so the two file names below must stay the same from one
# release to the next. How small and fast the published program is comes from the project's own
# settings, the same ones a local `dotnet publish` gets.
#
# For each release: update the version in IES_3.Avalonia.csproj and this workflow's default, and the
# notes in .github/release-notes.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this build (e.g. 0.2.0-beta)"
        required: true
        default: "0.2.0-beta"

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: IES_3.Avalonia/IES_3.Avalonia.csproj

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet test IES_3.Tests/IES_3.Tests.csproj -c Release

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish win-x64
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release -r win-x64
          -p:Version=${{ inputs.version }}
          -o publish/win-x64

      - name: Rename artifact
        shell: pwsh
        run: |
          $dest = "IAWScan3-win-x64.exe"
          Copy-Item "publish/win-x64/IES_3.Avalonia.exe" $dest
          echo "ASSET_PATH=$dest" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  build-linux-deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build .deb package
        run: |
          set -euo pipefail
          DEB_FILE=$(bash IES_3.Avalonia/packaging/build-deb.sh "${{ inputs.version }}" linux-x64 | tail -n 1)
          cp "$DEB_FILE" iaw-scan3_amd64.deb
          echo "ASSET_PATH=iaw-scan3_amd64.deb" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-linux-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "IAW Scan 3 ${{ inputs.version }}"
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: |
            artifacts/windows-exe/*
            artifacts/linux-deb/*
